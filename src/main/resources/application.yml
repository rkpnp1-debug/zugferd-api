server:
  port: 8080
  max-http-request-header-size: 8KB
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

spring:
  application:
    name: zugferd-api
  mvc:
    contentnegotiation:
      favor-parameter: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
      enabled: false

zugferd:
  input-root: ${ZUGFERD_INPUT_ROOT:/data/zugferd/input}
  output-root: ${ZUGFERD_OUTPUT_ROOT:/data/zugferd/output}
  max-file-size-mb: 20
  allowed-extensions: pdf
  profile: EN16931
  producer: Endur-ZUGFeRD-API
  creator: ZUGFeRD-Service
  max-concurrent-requests: 10

security:
  jwt-enabled: ${SECURITY_JWT_ENABLED:false}
  jwt-issuer-uri: ${SECURITY_JWT_ISSUER_URI:}
  jwt-audience: ${SECURITY_JWT_AUDIENCE:zugferd-api}
  required-scope: zugferd.generate
  api-key-header: X-API-Key
  api-key: ${SECURITY_API_KEY:}
  cors-allowed-origins: ${SECURITY_CORS_ORIGINS:https://endur.company.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.company.zugferd: INFO
    org.mustangproject: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{ISO8601} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
